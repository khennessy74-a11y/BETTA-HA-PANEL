name: Build BETTA HA Panel - panels3

on:
  workflow_dispatch:
  push:
    branches:
      - all-tile-ui-options
      - popup-controls

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build panels3
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          idf.py -B build-panels3 \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults.s3;sdkconfig.defaults.panels3" \
            -DSDKCONFIG=sdkconfig.panels3 \
            build

      - name: Package OTA firmware
        shell: bash
        run: |
          mkdir -p release/ota
          cp build-panels3/betta-ha-panel-s3.bin release/ota/betta86-ha-panel-v0.8.2-panels3.ota.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: betta-ha-panel-panels3
          path: |
            build-panels3/*.bin
            build-panels3/**/*.bin
            release/ota/*.ota.bin
